name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image version tag (for example v1.6.10-beta.1)"
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build And Push
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm  # GitHub 原生 ARM runner
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Get version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            echo "Unsupported build event: $GITHUB_EVENT_NAME"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ || ${#VERSION} -gt 128 ]]; then
            echo "Invalid image version: $VERSION"
            exit 1
          fi
          echo "Build version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 关键修复：移除 tags，使用 push-by-digest 模式
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          outputs: type=image,"name=${{ secrets.DOCKERHUB_REPOSITORY }}/chat-rag,ghcr.io/${{ github.repository }}",push-by-digest=true,name-canonical=true
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge Multi-Arch Manifests
    runs-on: ubuntu-latest
    needs:
      - build-and-push
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            echo "Unsupported build event: $GITHUB_EVENT_NAME"
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ || ${#VERSION} -gt 128 ]]; then
            echo "Invalid image version: $VERSION"
            exit 1
          fi
          echo "Build version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create manifest list and push to Docker Hub
        working-directory: /tmp/digests
        run: |
          TAGS=(-t "${{ secrets.DOCKERHUB_REPOSITORY }}/chat-rag:${{ steps.version.outputs.version }}")
          if [[ "${{ steps.version.outputs.version }}" != *-* ]]; then
            TAGS+=(-t "${{ secrets.DOCKERHUB_REPOSITORY }}/chat-rag:latest")
          fi
          docker buildx imagetools create \
            "${TAGS[@]}" \
            $(printf '${{ secrets.DOCKERHUB_REPOSITORY }}/chat-rag@sha256:%s ' *)

      - name: Create manifest list and push to GHCR
        working-directory: /tmp/digests
        run: |
          TAGS=(-t "ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}")
          if [[ "${{ steps.version.outputs.version }}" != *-* ]]; then
            TAGS+=(-t "ghcr.io/${{ github.repository }}:latest")
          fi
          docker buildx imagetools create \
            "${TAGS[@]}" \
            $(printf 'ghcr.io/${{ github.repository }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ secrets.DOCKERHUB_REPOSITORY }}/chat-rag:${{ steps.version.outputs.version }}
          docker buildx imagetools inspect ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
